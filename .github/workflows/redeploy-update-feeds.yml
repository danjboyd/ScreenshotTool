name: redeploy-update-feeds

# Deploys the update feeds a release run staged, again, for when that run's deploy didn't
# take (v0.1.1's, tagged on v0.1.1-rc4's commit, left the stable feeds at 0.1.0). Pages
# names a deployment after the commit, so run it from a commit that hasn't deployed yet
# (main after a new commit); it checks the feeds are live before it passes.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the package-release run whose github-pages artifact to deploy
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      # Only for the live check in .github/actions.
      - name: Check out the workflow actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Download the release run's Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack the site
        shell: bash
        run: |
          set -euo pipefail
          mkdir site
          tar -xf pages-artifact/artifact.tar -C site
          find site -type f | sort
          grep -h '"version"' site/updates/*/*.json || true

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4

      - name: Check the update feeds are live
        uses: ./.github/actions/check-pages-live
        with:
          site: site
          pages-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
