name: package-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.version.outputs.package_version }}
      release-tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      windows-sign: ${{ steps.version.outputs.windows_sign }}
    steps:
      - name: Resolve package version
        id: version
        shell: bash
        env:
          # A reusable workflow's inputs can't read secrets, so whether the signing certificate
          # is there passes through this job's outputs.
          HAS_WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          package_version="${tag_name#v}"
          echo "release_tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          # A tag with a pre-release part (v0.1.0-rc1) makes a GitHub prerelease: unsigned, and
          # its update feeds go to prerelease.json, so the stable feeds don't move (#111).
          if [[ "${package_version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
          # A stable release signs the MSI when the repository has a certificate
          # (WINDOWS_SIGN_PFX_BASE64); without one it ships unsigned, as the rcs do.
          if [[ "${package_version}" != *-* && "${HAS_WINDOWS_SIGN_CERT}" == "true" ]]; then
            echo "windows_sign=true" >> "${GITHUB_OUTPUT}"
          else
            echo "windows_sign=false" >> "${GITHUB_OUTPUT}"
            echo "The Windows MSI won't be signed." >&2
          fi

  package-windows:
    needs: resolve-version
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@v0.1.4
    with:
      manifest-path: packaging/package.manifest.json
      backend: msi
      package-version: ${{ needs.resolve-version.outputs.package-version }}
      msys2-packages: >-
        mingw-w64-clang-x86_64-cmark
      # danjboyd/libs-back's carry branch: GNUstep's backend with the fixes the
      # Windows build ships ahead of GNUstep (its packaging/README.md lists them).
      msys2-package-urls: >-
        https://github.com/danjboyd/libs-back/releases/download/carry-0.32.0.5/mingw-w64-clang-x86_64-gnustep-back-0.32.0.5-1-any.pkg.tar.zst
      run-validation: true
      run-smoke: true
      artifact-name: screenshottool-windows
      sign-artifacts: ${{ needs.resolve-version.outputs.windows-sign == 'true' }}
      sign-timestamp-url: http://timestamp.digicert.com
      # A prerelease build checks the prerelease feed, which says it's the prerelease channel
      # (#111). Stable tags run no preflight.
      preflight-shell: pwsh
      preflight-command: ${{ needs.resolve-version.outputs.prerelease == 'true' && './scripts/use_prerelease_update_channel.ps1' || '' }}
    secrets:
      sign_pfx_base64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      sign_pfx_password: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      sign_cert_sha1: ${{ secrets.WINDOWS_SIGN_CERT_SHA1 }}

  package-linux:
    needs: resolve-version
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@v0.1.4
    with:
      manifest-path: packaging/package.manifest.json
      backend: appimage
      package-version: ${{ needs.resolve-version.outputs.package-version }}
      # An explicit image, not ubuntu-latest (Ubuntu 26 from October 2026): the AppImage bundles
      # the runner's libraries, so its base and glibc floor change only when this does.
      runs-on-appimage: '["ubuntu-24.04"]'
      skip-default-host-setup: true
      # The packager rejects its default apt list when it skips host setup; the
      # preflight script installs those packages itself.
      appimage-apt-packages: ""
      preflight-shell: bash
      # The packager's AppImage smoke test launches the app, which needs an X server: start
      # Xvfb here and give the later steps its DISPLAY.
      # A prerelease build checks the prerelease feed (#111), as on Windows.
      preflight-command: >-
        bash ./scripts/bootstrap_gnustep_linux_ci.sh &&
        if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then pwsh -NoProfile -File ./scripts/use_prerelease_update_channel.ps1; fi &&
        { setsid nohup Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > "${RUNNER_TEMP}/xvfb.log" 2>&1 & } &&
        echo "DISPLAY=:99" >> "${GITHUB_ENV}"
      run-validation: true
      run-smoke: true
      # The runner has GNUstep in /usr/GNUstep, which hid v0.1.0's AppImage loading the host's
      # GNUstep: launch it again on a host without one.
      # Fedora installs no DejaVu, which gnustep-back falls back to: rc3 showed no window there
      # outside GNOME (the manifest now bundles it).
      appimage-clean-smoke-image: ubuntu:24.04 fedora:42
      artifact-name: screenshottool-linux

  package-macos:
    # Not signed with a Developer ID yet: the DMG carries a note on opening an unsigned app.
    needs: resolve-version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number (CFBundleVersion), which Sparkle compares, is the commit count.
          fetch-depth: 0
      - name: Build ScreenshotTool (Cocoa)
        env:
          VERSION: ${{ needs.resolve-version.outputs.package-version }}
        run: scripts/build_cocoa.sh
      - name: Smoke test
        run: scripts/smoke_macos_app.sh build/cocoa/ScreenshotTool.app
      - name: Package DMG
        env:
          VERSION: ${{ needs.resolve-version.outputs.package-version }}
        run: scripts/package_macos_dmg.sh build/cocoa/ScreenshotTool.app
      - name: Sparkle update feed
        # Signs the DMG with the EdDSA key the app's SUPublicEDKey matches, and writes the
        # appcast the publish job puts on Pages.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ needs.resolve-version.outputs.package-version }}
          TAG: ${{ needs.resolve-version.outputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
            echo "No SPARKLE_ED_PRIVATE_KEY secret: no macOS update feed." >&2
            exit 0
          fi
          dmg="ScreenshotTool-${VERSION}-macOS.dmg"
          scripts/make_macos_appcast.sh build/cocoa/ScreenshotTool.app "Staging/${dmg}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${dmg}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            "Staging/ScreenshotTool-${VERSION}-macOS.appcast.xml"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: screenshottool-macos-packages
          path: |
            Staging/*.dmg
            Staging/*.appcast.xml

  publish-release-assets:
    needs:
      - resolve-version
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      # Only for the live check in .github/actions.
      - name: Check out the workflow actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Download Windows package artifacts
        uses: actions/download-artifact@v4
        with:
          name: screenshottool-windows-packages
          path: dist/windows

      - name: Download Linux package artifacts
        uses: actions/download-artifact@v4
        with:
          name: screenshottool-linux-packages
          path: dist/linux

      - name: Download macOS package artifacts
        uses: actions/download-artifact@v4
        with:
          name: screenshottool-macos-packages
          path: dist/macos

      - name: Stage release assets
        shell: bash
        env:
          PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets site/updates/windows site/updates/linux site/updates/macos
          cp dist/windows/* release-assets/
          cp dist/linux/* release-assets/
          # The packager's build records stay with the run's artifacts: they hold the runner's
          # paths and are no use to someone downloading the app.
          rm -f release-assets/*.metadata.json release-assets/*.diagnostics.txt release-assets/*.wixpdb
          # The appcast goes to Pages only.
          cp dist/macos/*.dmg release-assets/
          # Bare file names, so `sha256sum -c SHA256SUMS` works next to the downloads.
          (cd release-assets && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS release-assets/
          # A Pages deploy replaces the whole site: carry the feeds already published forward.
          for platform in windows linux; do
            for channel in stable prerelease; do
              curl -fsSL "${PAGES_URL}/updates/${platform}/${channel}.json" \
                -o "site/updates/${platform}/${channel}.json" \
                || rm -f "site/updates/${platform}/${channel}.json"
            done
          done
          for channel in stable prerelease; do
            curl -fsSL "${PAGES_URL}/updates/macos/${channel}.xml" \
              -o "site/updates/macos/${channel}.xml" \
              || rm -f "site/updates/macos/${channel}.xml"
          done
          channel=stable
          if [ "${PRERELEASE}" = "true" ]; then
            channel=prerelease
          fi
          cp dist/windows/*.update-feed.json "site/updates/windows/${channel}.json"
          cp dist/linux/*.update-feed.json "site/updates/linux/${channel}.json"
          # Sparkle's feed (scripts/make_macos_appcast.sh), when the signing key was there.
          for appcast in dist/macos/*.appcast.xml; do
            [ -f "${appcast}" ] && cp "${appcast}" "site/updates/macos/${channel}.xml"
          done
          # rc builds check the prerelease feeds, so a stable release goes there too, or their
          # testers are never offered it (#195). GPUpdater skips a feed whose channel isn't its
          # own; Sparkle's appcast has no channel and compares build numbers.
          if [ "${channel}" = "stable" ]; then
            for platform in windows linux; do
              jq '.channel = "prerelease" | .feedUrl |= sub("/stable[.]json$"; "/prerelease.json")' \
                "site/updates/${platform}/stable.json" > "site/updates/${platform}/prerelease.json"
            done
            if [ -f site/updates/macos/stable.xml ]; then
              cp site/updates/macos/stable.xml site/updates/macos/prerelease.xml
            fi
          fi
          find site -type f | sort

      - name: Publish draft GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.release-tag }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}
          files: release-assets/*

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # Kept so redeploy-update-feeds can deploy this site again.
          retention-days: 30

      # Pages names a deployment after the commit, so a release tagged on a commit
      # that already deployed (v0.1.1 on rc4's) leaves the old site up. Tag a final
      # release on a commit of its own; the live check fails the run if not.
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

      - name: Check the update feeds are live
        uses: ./.github/actions/check-pages-live
        with:
          site: site
          pages-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publish final GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh can't find the repository from git.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${{ needs.resolve-version.outputs.release-tag }}" --draft=false
