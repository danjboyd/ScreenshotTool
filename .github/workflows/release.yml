name: package-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package_version }}
      release-tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          package_version="${tag_name#v}"
          echo "release_tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          # A tag with a pre-release part (v0.1.0-rc1) makes a GitHub prerelease: unsigned, and
          # its update feeds go to prerelease.json, so the stable feeds don't move (#111).
          if [[ "${package_version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  package-windows:
    needs: resolve-version
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@main
    with:
      manifest-path: packaging/package.manifest.json
      backend: msi
      package-version: ${{ needs.resolve-version.outputs.package-version }}
      packager-repository: danjboyd/gnustep-packager
      packager-ref: main
      msys2-packages: >-
        mingw-w64-clang-x86_64-cmark
      run-validation: true
      run-smoke: true
      artifact-name: screenshottool-windows
      sign-artifacts: ${{ needs.resolve-version.outputs.prerelease != 'true' }}
      sign-timestamp-url: http://timestamp.digicert.com
    secrets:
      sign_pfx_base64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      sign_pfx_password: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      sign_cert_sha1: ${{ secrets.WINDOWS_SIGN_CERT_SHA1 }}

  package-linux:
    needs: resolve-version
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@main
    with:
      manifest-path: packaging/package.manifest.json
      backend: appimage
      package-version: ${{ needs.resolve-version.outputs.package-version }}
      packager-repository: danjboyd/gnustep-packager
      packager-ref: main
      skip-default-host-setup: true
      # The packager rejects its default apt list when it skips host setup; the
      # preflight script installs those packages itself.
      appimage-apt-packages: ""
      preflight-shell: bash
      # The manifest's default theme (WinUITheme) is Windows-only, and the packager
      # can't scope it per backend yet (danjboyd/gnustep-packager#3). It also derives
      # packagedDefaults.defaultTheme from a themeInputs entry's "default" flag on every
      # backend, so drop both from the Linux job's copy of the manifest. The themes'
      # license notices go too: the AppImage doesn't bundle them, and stage_release.ps1
      # stages their files only on Windows.
      # The packager's AppImage smoke test launches the app, which needs an X server: start
      # Xvfb here and give the later steps its DISPLAY.
      preflight-command: >-
        bash ./scripts/bootstrap_gnustep_linux_ci.sh &&
        jq 'del(.packagedDefaults) | .themeInputs |= map(del(.default)) | ([.themeInputs[].name]) as $themes | .compliance.runtimeNotices |= map(select(.name as $n | $themes | index($n) | not))' packaging/package.manifest.json > "${RUNNER_TEMP}/manifest.json" &&
        mv "${RUNNER_TEMP}/manifest.json" packaging/package.manifest.json &&
        { setsid nohup Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > "${RUNNER_TEMP}/xvfb.log" 2>&1 & } &&
        echo "DISPLAY=:99" >> "${GITHUB_ENV}"
      run-validation: true
      run-smoke: true
      artifact-name: screenshottool-linux

  package-macos:
    # Not signed with a Developer ID yet: the DMG carries a note on opening an unsigned app.
    needs: resolve-version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build ScreenshotTool (Cocoa)
        env:
          VERSION: ${{ needs.resolve-version.outputs.package-version }}
        run: scripts/build_cocoa.sh
      - name: Smoke test
        run: scripts/smoke_macos_app.sh build/cocoa/ScreenshotTool.app
      - name: Package DMG
        env:
          VERSION: ${{ needs.resolve-version.outputs.package-version }}
        run: scripts/package_macos_dmg.sh build/cocoa/ScreenshotTool.app
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: screenshottool-macos-packages
          path: Staging/*.dmg

  publish-release-assets:
    needs:
      - resolve-version
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Download Windows package artifacts
        uses: actions/download-artifact@v4
        with:
          name: screenshottool-windows-packages
          path: dist/windows

      - name: Download Linux package artifacts
        uses: actions/download-artifact@v4
        with:
          name: screenshottool-linux-packages
          path: dist/linux

      - name: Download macOS package artifacts
        uses: actions/download-artifact@v4
        with:
          name: screenshottool-macos-packages
          path: dist/macos

      - name: Stage release assets
        shell: bash
        env:
          PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets site/updates/windows site/updates/linux
          cp dist/windows/* release-assets/
          cp dist/linux/* release-assets/
          # No update feed for macOS yet: the packaged updater is GNUstep's (Sparkle to come).
          cp dist/macos/*.dmg release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS
          # A Pages deploy replaces the whole site: carry the feeds already published forward.
          for platform in windows linux; do
            for channel in stable prerelease; do
              curl -fsSL "${PAGES_URL}/updates/${platform}/${channel}.json" \
                -o "site/updates/${platform}/${channel}.json" \
                || rm -f "site/updates/${platform}/${channel}.json"
            done
          done
          channel=stable
          if [ "${PRERELEASE}" = "true" ]; then
            channel=prerelease
          fi
          cp dist/windows/*.update-feed.json "site/updates/windows/${channel}.json"
          cp dist/linux/*.update-feed.json "site/updates/linux/${channel}.json"
          find site -type f | sort

      - name: Publish draft GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.release-tag }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}
          files: release-assets/*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Publish final GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh can't find the repository from git.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${{ needs.resolve-version.outputs.release-tag }}" --draft=false
