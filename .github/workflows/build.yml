name: build-and-package

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    outputs:
      appimage_name: ${{ steps.naming.outputs.appimage_name }}
      appimage_path: ${{ steps.naming.outputs.appimage_path }}
      appimage_sha_name: ${{ steps.naming.outputs.appimage_sha_name }}
      artifact_name: ${{ steps.naming.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Determine artifact names
        id: naming
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            APPIMAGE_NAME="ScreenshotTool-${GITHUB_REF_NAME}-x86_64.AppImage"
          else
            APPIMAGE_NAME="ScreenshotTool-x86_64.AppImage"
          fi
          echo "appimage_name=${APPIMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "appimage_path=Staging/${APPIMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "appimage_sha_name=${APPIMAGE_NAME}.sha256" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${APPIMAGE_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Prepare the GNUstep prefix
        # The cache restores /usr/GNUstep as this user. A new key each week also picks up the
        # libraries that aren't pinned (libobjc2, libdispatch, tools-make, Sombre).
        id: gnustep-prefix
        run: |
          sudo mkdir -p /usr/GNUstep
          sudo chown "$(id -u):$(id -g)" /usr/GNUstep
          echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"
      - name: Restore the GNUstep build
        id: gnustep-cache
        uses: actions/cache@v4
        with:
          path: /usr/GNUstep
          key: gnustep-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_gnustep_linux_ci.sh', 'scripts/patches/**') }}-${{ steps.gnustep-prefix.outputs.week }}
      - name: Bootstrap GNUstep Linux toolchain
        env:
          PREFIX: /usr/GNUstep
          GNUSTEP_PREBUILT: ${{ steps.gnustep-cache.outputs.cache-hit }}
        run: |
          chmod +x ./scripts/bootstrap_gnustep_linux_ci.sh
          ./scripts/bootstrap_gnustep_linux_ci.sh
      - name: Build ScreenshotTool (GNUstep)
        run: pwsh -NoProfile -File scripts/build_release.ps1 -ManifestPath packaging/package.manifest.json
      - name: Keep core dumps of crashed tests
        # A crashed test run leaves its core in /tmp, for the backtrace step below (#82).
        run: sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: Unit tests
        # Many tests need a window server; under Xvfb they run instead of skipping. A 24-bit
        # screen so pixel checks see true colours.
        run: |
          echo "Fonts available: $(fc-list | wc -l); DejaVu Sans: $(fc-list 'DejaVu Sans' | wc -l)"
          ulimit -c unlimited
          xvfb-run -a -s "-screen 0 1920x1080x24" Tools/run_tests.sh
      - name: Unit tests (Adwaita theme)
        # The same suite under the Adwaita theme, which the bootstrap installs (#74).
        env:
          TEST_THEME: Adwaita
          TEST_LOG: tests-adwaita.log
          TEST_JUNIT: tests-adwaita-junit.xml
        run: |
          ulimit -c unlimited
          xvfb-run -a -s "-screen 0 1920x1080x24" Tools/run_tests.sh
      - name: Backtrace of a crashed test run
        if: failure()
        run: |
          for core in /tmp/core.*; do
            [ -f "${core}" ] || continue
            echo "== ${core}"
            gdb -batch -ex "set pagination off" -ex "info sharedlibrary libgnustep" \
              -ex "thread apply all bt 40" third_party/tools-xctest/obj/xctest "${core}" 2>&1 | grep -v "^\[New LWP"
          done
      - name: Screenshots
        # The main screens under GNUstep's default theme and Adwaita, for review (#75). The
        # script runs its own virtual display and window manager.
        run: Tools/screenshots.sh screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: |
            tests.log
            tests-junit.xml
            tests-adwaita.log
            tests-adwaita-junit.xml
          if-no-files-found: ignore
      - name: Download linuxdeploy
        run: |
          mkdir -p /tmp/linuxdeploy
          curl -L https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /tmp/linuxdeploy/linuxdeploy
          curl -L https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -o /tmp/linuxdeploy/linuxdeploy-plugin-appimage
          chmod +x /tmp/linuxdeploy/linuxdeploy /tmp/linuxdeploy/linuxdeploy-plugin-appimage
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY: /tmp/linuxdeploy/linuxdeploy
          LINUXDEPLOY_PLUGIN_APPIMAGE: /tmp/linuxdeploy/linuxdeploy-plugin-appimage
          GNUSTEP_ROOT: /usr/GNUstep
          OUTPUT_NAME: ${{ steps.naming.outputs.appimage_name }}
        run: scripts/package_appimage.sh
      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        # The app needs an X server; the runner has none, so give it a virtual one.
        run: xvfb-run -a scripts/smoke_appimage.sh "${{ steps.naming.outputs.appimage_path }}"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.artifact_name }}
          path: |
            ${{ steps.naming.outputs.appimage_path }}
            Staging/${{ steps.naming.outputs.appimage_sha_name }}

