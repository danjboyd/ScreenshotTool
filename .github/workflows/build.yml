name: build-and-package

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  linux-toolchain:
    # The GNUstep toolchain for the AppImage, built from scripts/gnustep-toolchain.lock.json by
    # gnustep-cli-new's custom toolchain builder in its Ubuntu 24.04 image (glibc 2.39, as the
    # AppImage has today). Everything it builds is pinned, so the cache key is the lock, its
    # patches and the builder's commit. linux-appimage restores it from the cache.
    runs-on: ubuntu-24.04
    env:
      TOOLCHAIN_PREFIX: /opt/screenshottool-gnustep/GNUstep
    steps:
      - uses: actions/checkout@v4
      - name: Read the toolchain builder's commit
        id: builder
        run: echo "commit=$(tr -d '[:space:]' < scripts/gnustep-cli-new.commit)" >> "${GITHUB_OUTPUT}"
      - name: Check out the toolchain builder (gnustep-cli-new)
        uses: actions/checkout@v4
        with:
          repository: danjboyd/gnustep-cli-new
          ref: ${{ steps.builder.outputs.commit }}
          path: .ci/gnustep-cli-new
      - name: Prepare the toolchain prefix
        # Outside /usr: the builder mounts the prefix's parent into its container at the same path.
        run: |
          sudo mkdir -p "$(dirname "${TOOLCHAIN_PREFIX}")"
          sudo chown "$(id -u):$(id -g)" "$(dirname "${TOOLCHAIN_PREFIX}")"
      - name: Restore the toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_PREFIX }}
          key: gnustep-toolchain-${{ runner.os }}-${{ hashFiles('scripts/gnustep-toolchain.lock.json', 'scripts/patches/**', 'scripts/gnustep-cli-new.commit') }}
      - name: Build the toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh .ci/gnustep-cli-new/scripts/dev/build-custom-toolchain-in-container.sh scripts/gnustep-toolchain.lock.json "${TOOLCHAIN_PREFIX}" "$(nproc)"
      - name: Check the toolchain
        run: |
          set -euo pipefail
          # The runtime libraries for the lock's optional features, so ldd can resolve them.
          sudo apt-get install -y --no-install-recommends libcups2t64 libsndfile1 libxmu6 libxcursor1 \
            libxtst6 libxrandr2 libxcomposite1 >/dev/null
          provenance="${TOOLCHAIN_PREFIX}/gnustep-toolchain-provenance.json"
          jq -e '.official == false' "${provenance}" >/dev/null
          test "$(jq -r '.lock.sha256' "${provenance}")" = "$(sha256sum scripts/gnustep-toolchain.lock.json | cut -d' ' -f1)"
          jq -r '.components[] | "\(.name) \(.resolved_commit)"' "${provenance}"
          # The lock's install_domain puts the GNUstep libraries in the SYSTEM domain, where the
          # AppImage staging reads them.
          test ! -e "${TOOLCHAIN_PREFIX}/Local/Library/Libraries/libgnustep-base.so"
          for lib in "${TOOLCHAIN_PREFIX}"/System/Library/Libraries/libgnustep-{base,gui}.so \
                     "${TOOLCHAIN_PREFIX}"/System/Library/Bundles/libgnustep-back-*.bundle/libgnustep-back-*; do
            echo "${lib}"
            if LD_LIBRARY_PATH="${TOOLCHAIN_PREFIX}/lib:${TOOLCHAIN_PREFIX}/System/Library/Libraries" ldd "${lib}" | grep 'not found'; then
              exit 1
            fi
          done
          # The README promises glibc 2.38: nothing in the toolchain may need a newer symbol.
          # objdump fails on the scripts among the tools; only the symbols matter.
          newest=$({ find "${TOOLCHAIN_PREFIX}" -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null || true; } \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "Newest glibc symbol: ${newest}"
          [ "$(printf '%s\n' "${newest#GLIBC_}" 2.38 | sort -V | tail -n 1)" = 2.38 ]
          du -sh "${TOOLCHAIN_PREFIX}"
      - name: Upload the toolchain build logs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-toolchain-logs
          path: |
            /opt/screenshottool-gnustep/.GNUstep-build/logs/*.log
            /opt/screenshottool-gnustep/GNUstep/gnustep-toolchain-provenance.json
          if-no-files-found: ignore

  linux-appimage:
    needs: linux-toolchain
    runs-on: ubuntu-24.04
    outputs:
      appimage_name: ${{ steps.naming.outputs.appimage_name }}
      appimage_path: ${{ steps.naming.outputs.appimage_path }}
      appimage_sha_name: ${{ steps.naming.outputs.appimage_sha_name }}
      artifact_name: ${{ steps.naming.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Determine artifact names
        id: naming
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            APPIMAGE_NAME="ScreenshotTool-${GITHUB_REF_NAME}-x86_64.AppImage"
          else
            APPIMAGE_NAME="ScreenshotTool-x86_64.AppImage"
          fi
          echo "appimage_name=${APPIMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "appimage_path=Staging/${APPIMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "appimage_sha_name=${APPIMAGE_NAME}.sha256" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${APPIMAGE_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Prepare the toolchain prefix
        run: |
          sudo mkdir -p /opt/screenshottool-gnustep
          sudo chown "$(id -u):$(id -g)" /opt/screenshottool-gnustep
      - name: Restore the GNUstep toolchain
        # Built and cached by linux-toolchain; the bootstrap builds it itself on a miss.
        uses: actions/cache/restore@v4
        with:
          path: /opt/screenshottool-gnustep/GNUstep
          key: gnustep-toolchain-${{ runner.os }}-${{ hashFiles('scripts/gnustep-toolchain.lock.json', 'scripts/patches/**', 'scripts/gnustep-cli-new.commit') }}
      - name: Bootstrap GNUstep Linux toolchain
        # Links /usr/GNUstep to the toolchain and builds the Sombre and Adwaita themes into it.
        env:
          PREFIX: /usr/GNUstep
        run: ./scripts/bootstrap_gnustep_linux_ci.sh
      - name: Build ScreenshotTool (GNUstep)
        run: pwsh -NoProfile -File scripts/build_release.ps1 -ManifestPath packaging/package.manifest.json
      - name: Keep core dumps of crashed tests
        # A crashed test run leaves its core in /tmp, for the backtrace step below (#82).
        run: sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: Unit tests
        # Many tests need a window server; under Xvfb they run instead of skipping. A 24-bit
        # screen so pixel checks see true colours.
        run: |
          echo "Fonts available: $(fc-list | wc -l); DejaVu Sans: $(fc-list 'DejaVu Sans' | wc -l)"
          ulimit -c unlimited
          xvfb-run -a -s "-screen 0 1920x1080x24" Tools/run_tests.sh
      - name: Unit tests (Adwaita theme)
        # The same suite under the Adwaita theme, which the bootstrap installs (#74).
        env:
          TEST_THEME: Adwaita
          TEST_LOG: tests-adwaita.log
          TEST_JUNIT: tests-adwaita-junit.xml
        run: |
          ulimit -c unlimited
          xvfb-run -a -s "-screen 0 1920x1080x24" Tools/run_tests.sh
      - name: Backtrace of a crashed test run
        if: failure()
        run: |
          for core in /tmp/core.*; do
            [ -f "${core}" ] || continue
            echo "== ${core}"
            gdb -batch -ex "set pagination off" -ex "info sharedlibrary libgnustep" \
              -ex "thread apply all bt 40" third_party/tools-xctest/obj/xctest "${core}" 2>&1 | grep -v "^\[New LWP"
          done
      - name: Screenshots
        # The main screens under GNUstep's default theme and Adwaita, for review (#75). The
        # script runs its own virtual display and window manager.
        run: Tools/screenshots.sh screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: |
            tests.log
            tests-junit.xml
            tests-adwaita.log
            tests-adwaita-junit.xml
          if-no-files-found: ignore
      - name: Download linuxdeploy
        run: |
          mkdir -p /tmp/linuxdeploy
          curl -L https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /tmp/linuxdeploy/linuxdeploy
          curl -L https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -o /tmp/linuxdeploy/linuxdeploy-plugin-appimage
          chmod +x /tmp/linuxdeploy/linuxdeploy /tmp/linuxdeploy/linuxdeploy-plugin-appimage
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY: /tmp/linuxdeploy/linuxdeploy
          LINUXDEPLOY_PLUGIN_APPIMAGE: /tmp/linuxdeploy/linuxdeploy-plugin-appimage
          GNUSTEP_ROOT: /usr/GNUstep
          OUTPUT_NAME: ${{ steps.naming.outputs.appimage_name }}
        run: scripts/package_appimage.sh
      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        # The app needs an X server; the runner has none, so give it a virtual one.
        run: xvfb-run -a scripts/smoke_appimage.sh "${{ steps.naming.outputs.appimage_path }}"
      - name: Smoke test AppImage on a host without GNUstep
        # The runner's /usr/GNUstep would hide an AppImage that loads the host's GNUstep.
        # linuxdeploy's excludelist leaves fontconfig, freetype, harfbuzz, GL, X11 and cups to the
        # host, so the container gets what a desktop install has (the release AppImage, from
        # gnustep-packager, bundles them and is checked without these).
        env:
          GP_CLEAN_SMOKE_PACKAGES: >-
            fontconfig libfreetype6 libharfbuzz0b libfribidi0 libcups2t64 libgmp10 libgl1
            libx11-xcb1 libxcb-dri3-0 libdrm2 libsm6 libice6
        run: scripts/smoke_appimage_clean.sh "${{ steps.naming.outputs.appimage_path }}" ubuntu:24.04
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.artifact_name }}
          path: |
            ${{ steps.naming.outputs.appimage_path }}
            Staging/${{ steps.naming.outputs.appimage_sha_name }}

  windows-tests:
    # Builds the app and the test bundle under MSYS2 CLANG64 and runs the unit tests (#109).
    # GNUstep comes from gnustep-cli-new, as in the Windows packaging workflow
    # (danjboyd/gnustep-packager's package-gnustep-app.yml).
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      GNUSTEP_CLI_MANIFEST_URL: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.0-dev/release-manifest.json
      GNUSTEP_CLI_BOOTSTRAP_URL: https://raw.githubusercontent.com/danjboyd/gnustep-cli-new/master/scripts/bootstrap/gnustep-bootstrap.ps1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            curl
            tar
            gzip
      - name: Install GNUstep (gnustep-cli-new)
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "gnustep-cli-new"
          $bootstrap = Join-Path $env:RUNNER_TEMP "gnustep-bootstrap.ps1"
          $env:PATH = (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clang64\bin') + ";" + $env:PATH
          curl.exe --fail --location --show-error --retry 3 --output $bootstrap $env:GNUSTEP_CLI_BOOTSTRAP_URL
          if ($LASTEXITCODE -ne 0) { throw "Downloading the gnustep-cli-new bootstrap failed" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File $bootstrap --json --yes setup --user --root $root --manifest $env:GNUSTEP_CLI_MANIFEST_URL
          if ($LASTEXITCODE -ne 0) { throw "gnustep-cli-new setup failed ($LASTEXITCODE)" }
          # The PATH the packaging workflow builds with: gnustep-cli-new's tools first, then MSYS2's
          # CLANG64. build_release.ps1 converts paths with cygpath, which has to be gnustep-cli-new's
          # (/cygdrive/d/...), not Git for Windows' (/d/...).
          (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clang64\bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          @(
            (Join-Path $root "bin"),
            (Join-Path $root "Tools"),
            (Join-Path $root "System\Tools"),
            (Join-Path $root "usr\bin"),
            (Join-Path $root "clang64\bin")
          ) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "GP_GNUSTEP_CLI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build ScreenshotTool
        run: ./scripts/build_release.ps1 -ManifestPath packaging/package.manifest.json
      - name: Unit tests
        # Each test class runs in its own xctest process, as on Linux; the runner's desktop
        # session is the window server.
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GP_GNUSTEP_CLI_ROOT
          $bash = Join-Path $root "usr\bin\bash.exe"
          # A login shell in the workspace (CHERE_INVOKING), where gnustep-cli-new's CLANG64 is /clang64.
          $env:MSYSTEM = "CLANG64"
          $env:CHERE_INVOKING = "1"
          $command = "set -eo pipefail; " +
            "set +u; source /clang64/share/GNUstep/Makefiles/GNUstep.sh; set -u; " +
            "Tools/run_tests.sh"
          & $bash -lc $command
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed ($LASTEXITCODE)" }
      - name: Show the test log
        if: failure()
        run: |
          if (Test-Path tests.log) { Get-Content tests.log -Tail 400 }
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-tests-log
          path: |
            tests.log
            tests-junit.xml
          if-no-files-found: ignore

  macos-app:
    # The Cocoa build (scripts/build_cocoa.sh): a universal app, launched once and packaged as a
    # DMG. The macOS 26 SDK gives it the current system look.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build ScreenshotTool (Cocoa)
        run: scripts/build_cocoa.sh
      - name: Unit tests
        # The suite Tools/run_tests.sh runs under GNUstep, with Apple's XCTest.
        run: Tools/run_tests_macos.sh
      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-tests-log
          path: tests-macos.log
          if-no-files-found: ignore
      - name: Smoke test
        run: scripts/smoke_macos_app.sh build/cocoa/ScreenshotTool.app
      - name: Package DMG
        run: scripts/package_macos_dmg.sh build/cocoa/ScreenshotTool.app
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotTool-macOS
          path: |
            Staging/*.dmg
            Staging/*.dmg.sha256
