name: Deploy Pages and check it is live
description: >-
  Deploys an uploaded Pages artifact under a build version unique to this run,
  then waits until every file of the site is served as built.

  actions/deploy-pages names a deployment after the commit (GITHUB_SHA). A
  release tagged on the same commit as the rc before it then "deploys" the rc's
  site again: v0.1.1, on rc4's commit, reported success and left the update
  feeds at 0.1.0.

inputs:
  artifact-id:
    description: The artifact_id output of actions/upload-pages-artifact.
    required: true
  site:
    description: The directory that was uploaded, to compare with what Pages serves.
    required: true
  pages-url:
    description: The site's base URL, without a trailing slash.
    required: true

outputs:
  build-version:
    description: The Pages build version the deployment used.
    value: ${{ steps.deploy.outputs.build-version }}

runs:
  using: composite
  steps:
    - name: Deploy Pages
      id: deploy
      uses: actions/github-script@v7
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        BUILD_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      with:
        script: |
          // The calls and statuses actions/deploy-pages@v4 uses, with our own build version.
          const buildVersion = process.env.BUILD_VERSION;
          const { owner, repo } = context.repo;
          const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
            owner,
            repo,
            artifact_id: Number(process.env.ARTIFACT_ID),
            pages_build_version: buildVersion,
            oidc_token: await core.getIDToken(),
          });
          const deploymentId = data.id || data.status_url?.split('/').pop() || buildVersion;
          core.info(`Created Pages deployment ${deploymentId} for build ${buildVersion}`);
          core.setOutput('build-version', buildVersion);

          // As actions/deploy-pages does: a deployment left pending can block the next one.
          const cancel = async () => {
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                { owner, repo, pages_deployment_id: deploymentId });
              core.info(`Cancelled Pages deployment ${deploymentId}.`);
            } catch (error) {
              core.warning(`Couldn't cancel Pages deployment ${deploymentId}: ${error.message}`);
            }
          };

          const failed = ['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
            'deployment_cancelled', 'deployment_lost'];
          const deadline = Date.now() + 10 * 60 * 1000;
          let errors = 0;
          while (Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, 5000));
            try {
              const { data: status } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                { owner, repo, pages_deployment_id: deploymentId });
              if (status.status === 'succeed') {
                core.info('Pages deployment succeeded.');
                return;
              }
              if (failed.includes(status.status)) {
                core.setFailed(`Pages deployment ${deploymentId}: ${status.status}`);
                return;
              }
              core.info(`Pages deployment status: ${status.status}`);
              errors = 0;
            } catch (error) {
              if (++errors >= 10) {
                await cancel();
                core.setFailed(`Pages deployment ${deploymentId}: status checks keep failing: ${error.message}`);
                return;
              }
              core.warning(`Pages deployment status check failed: ${error.message}`);
            }
          }
          await cancel();
          core.setFailed(`Pages deployment ${deploymentId} did not finish within 10 minutes.`);

    - name: Check the site is live
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        PAGES_URL: ${{ inputs.pages-url }}
        BUILD_VERSION: ${{ steps.deploy.outputs.build-version }}
      run: |
        set -euo pipefail
        # Pages takes a little while to serve a new deployment; the query string
        # gets past its CDN cache.
        cd "${SITE}"
        pending=$(find . -type f | sed 's|^\./||' | sort)
        for attempt in $(seq 1 30); do
          still=""
          for file in ${pending}; do
            want=$(sha256sum < "${file}" | cut -d' ' -f1)
            got=$(curl -fsSL "${PAGES_URL}/${file}?build=${BUILD_VERSION}" | sha256sum | cut -d' ' -f1) || got=""
            [ "${got}" = "${want}" ] || still="${still} ${file}"
          done
          if [ -z "${still}" ]; then
            echo "Pages serves every file as built:"
            echo "${pending}" | sed 's/^/  /'
            exit 0
          fi
          pending=${still}
          sleep 10
        done
        echo "::error::Pages still doesn't serve these files as built:${pending}"
        exit 1
